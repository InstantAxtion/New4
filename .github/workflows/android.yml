name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm test

  apk:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Show Android SDK location
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Use the game's MainActivity (full screen, back gesture)
        run: cp android-overrides/MainActivity.java android/app/src/main/java/com/hearthlands/game/MainActivity.java

      - name: Generate app icon and splash
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Sync web game into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Hearthlands.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hearthlands-apk
          path: Hearthlands.apk
