<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1d33">
<title>Port City</title>
<style>
:root{
  --bg:#0b1d33; --panel:#132a47; --panel2:#1a3558; --line:#25456d;
  --text:#e8f0fa; --muted:#93a9c4; --accent:#3fb6ff; --good:#4ad991; --bad:#ff6b6b; --warn:#ffc65c;
  --build:#3fb6ff; --policy:#b18cff; --diplo:#4ad991; --social:#ffb35c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:520px;margin:0 auto}
.hidden{display:none!important}

/* top bar */
#topbar{position:sticky;top:0;z-index:20;background:rgba(11,29,51,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:6px 8px 6px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stat{background:var(--panel);border-radius:9px;padding:4px 2px;text-align:center;min-width:0}
.stat .ic{font-size:13px;line-height:1}
.stat .v{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.stat .d{font-size:10px;line-height:1.1}
.up{color:var(--good)} .down{color:var(--bad)}
.yearline{display:flex;justify-content:space-between;align-items:center;margin-top:5px;padding:0 2px}
.year{font-weight:800;font-size:18px}
.era{font-size:12px;color:var(--accent);font-weight:600;text-align:right}
.yearprog{height:3px;background:var(--panel);border-radius:2px;margin-top:4px;overflow:hidden}
.yearprog i{display:block;height:100%;background:var(--accent)}

/* scene */
.scenewrap{position:relative;margin:8px 8px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#scene{display:block;width:100%;height:210px}
.scenetag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.45);border-radius:8px;padding:2px 7px;font-size:11px}
.scenetag2{left:auto;right:8px}

/* panels */
.panel{background:var(--panel);margin:8px;border-radius:14px;padding:10px;border:1px solid var(--line)}
.ptitle{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
#chart{display:block;width:100%;height:96px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12.5px;margin-top:8px}
.kv div{display:flex;justify-content:space-between;gap:6px}
.kv span:first-child{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11.5px;background:var(--panel2);border-radius:999px;padding:3px 9px;color:var(--text)}
.chip.warn{background:#4a3a14;color:var(--warn)} .chip.bad{background:#4a1d24;color:#ffb0b0}
.news{font-size:12.5px;max-height:120px;overflow:auto}
.news div{padding:4px 0;border-bottom:1px solid var(--line)}
.news div:last-child{border:0}
.news b{color:var(--accent);font-weight:700;margin-right:4px}

/* tabs & cards */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 8px 0;position:sticky;top:94px;z-index:10;background:var(--bg);padding:4px 0}
.tab{background:var(--panel);border-radius:10px;padding:9px 2px;font-weight:700;font-size:13px;border:1px solid var(--line);min-height:44px}
.tab.on{background:var(--panel2);border-color:var(--accent)}
.tab[data-c=build].on{border-color:var(--build)} .tab[data-c=policy].on{border-color:var(--policy)}
.tab[data-c=diplo].on{border-color:var(--diplo)} .tab[data-c=social].on{border-color:var(--social)}
#cards{display:grid;grid-template-columns:1fr;gap:7px;margin:8px}
.card{display:flex;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--build);border-radius:12px;padding:10px;min-height:64px;width:100%;transition:transform .08s}
.card:active{transform:scale(.98)}
.card[data-c=policy]{border-left-color:var(--policy)} .card[data-c=diplo]{border-left-color:var(--diplo)} .card[data-c=social]{border-left-color:var(--social)}
.card .ci{font-size:26px;line-height:1;width:32px;text-align:center;flex:none;padding-top:2px}
.card .cb{flex:1;min-width:0}
.card .cn{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:6px}
.card .cost{font-weight:700;color:var(--warn);white-space:nowrap;font-size:14px}
.card .cd{font-size:12.5px;color:var(--muted);margin-top:2px}
.card .cm{font-size:11.5px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;color:var(--accent)}
.card.dis{opacity:.45}
.card.dis .why{color:var(--bad)}
.card.done{opacity:.55;border-left-color:var(--good)}

/* bottom bar */
#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,29,51,.97);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
#bottombar .inner{max-width:520px;margin:0 auto;display:flex;gap:8px}
.btn{background:var(--accent);color:#04223a;font-weight:800;border-radius:12px;padding:14px 16px;min-height:52px;font-size:16px}
.btn.sec{background:var(--panel2);color:var(--text);font-weight:700}
.btn.big{flex:1}
.btn:disabled{opacity:.4}
.pips{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.pips i{width:10px;height:10px;border-radius:50%;background:#04223a;opacity:.85}
.pips i.used{opacity:.2}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(3,10,20,.78);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--panel);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.paper{background:#f3eee2;color:#1d1a14;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-family:Georgia,"Times New Roman",serif}
.paper .mast{display:flex;justify-content:space-between;font-size:11px;border-bottom:2px solid #1d1a14;padding-bottom:4px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
.paper h2{margin:0 0 6px;font-size:22px;line-height:1.15;font-weight:900}
.paper p{margin:0;font-size:14.5px}
.choice{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;min-height:56px}
.choice b{display:block;font-size:15px}
.choice small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.choice:disabled{opacity:.4}
.choice:active{background:var(--line)}
.sheet h1{margin:0 0 6px;font-size:28px}
.sheet h3{margin:14px 0 4px;font-size:15px;color:var(--accent)}
.sheet p,.sheet li{font-size:14px;color:#cfdced}
.sheet ul{padding-left:18px;margin:4px 0}
.report{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:14px;margin:8px 0}
.report span:nth-child(even){text-align:right;font-weight:700}
.title-screen{text-align:center;padding:30px 18px}
.logo{font-size:56px}
.title-screen h1{font-size:40px;margin:4px 0;letter-spacing:-.02em}
.title-screen .sub{color:var(--muted);margin-bottom:26px}
.title-screen .btn{display:block;width:100%;margin:10px 0}
.rank{font-size:30px;font-weight:900;color:var(--warn);margin:4px 0}
#toast{position:fixed;left:50%;top:110px;transform:translateX(-50%);z-index:60;background:#0e3a5c;border:1px solid var(--accent);color:var(--text);padding:9px 14px;border-radius:12px;font-size:13.5px;max-width:92%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <div id="topbar" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="yearline"><div class="year" id="year">1950</div><div class="era" id="era"></div></div>
    <div class="yearprog"><i id="yprog"></i></div>
  </div>

  <div id="main" class="hidden">
    <div class="scenewrap">
      <canvas id="scene"></canvas>
      <div class="scenetag" id="tagDepth"></div>
      <div class="scenetag scenetag2" id="tagCap"></div>
    </div>

    <div class="panel">
      <div class="ptitle"><span>Trade volume (TEU / yr)</span><span id="chartMax"></span></div>
      <canvas id="chart"></canvas>
      <div class="kv" id="kv"></div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab on" data-c="build">🏗 Build</button>
      <button class="tab" data-c="policy">📜 Policy</button>
      <button class="tab" data-c="diplo">🤝 Diplo</button>
      <button class="tab" data-c="social">🏘 Social</button>
    </div>
    <div id="cards"></div>

    <div class="panel">
      <div class="ptitle"><span>Harbor Gazette</span></div>
      <div class="news" id="news"></div>
    </div>
    <div class="panel">
      <div class="ptitle"><span>Menu</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sec" id="btnHelp">How to play</button>
        <button class="btn sec" id="btnQuit">Title screen</button>
      </div>
      <p class="small" style="margin:8px 0 0">Progress is saved automatically on this device.</p>
    </div>
  </div>

  <div id="title" class="title-screen">
    <div class="logo">⚓</div>
    <h1>Port City</h1>
    <div class="sub">Govern a coastal town from 1950 to 2050.<br>Build it into a world trade hub.</div>
    <button class="btn" id="btnContinue">Continue</button>
    <button class="btn" id="btnNew">New Game</button>
    <button class="btn sec" id="btnHow">How to Play</button>
    <p class="small" id="bestLine"></p>
  </div>
</div>

<div id="bottombar" class="hidden">
  <div class="inner">
    <button class="btn sec" id="btnUndo">↶ Undo</button>
    <button class="btn big" id="btnEnd">End Year <span class="pips" id="pips"></span></button>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
/* ===================== CORE START (simulation, no DOM) ===================== */
const START = 1950, END = 2050, ACTIONS = 3;
const ERAS = [
  {n:'Break-Bulk Era', from:1950},
  {n:'Containerization', from:1966},
  {n:'Globalization', from:1990},
  {n:'Automation & Green Shipping', from:2010},
  {n:'Climate Pressure', from:2030}
];
const FEE_NAMES = ['Very Low','Low','Standard','High','Very High'];
const FEE_ATTR  = [1.30, 1.15, 1.00, 0.87, 0.75];
const FEE_RATE  = [0.065, 0.090, 0.115, 0.140, 0.165]; // $M per thousand TEU
const LABOR = ['Strict','Balanced','Loose'];
const PARTNERS = ['the Northern Commonwealth','the Eastern Federation','the Southern Union','the Pacific Concord','the Continental Bloc'];

function eraIdx(y){ let i=0; for(let j=0;j<ERAS.length;j++) if(y>=ERAS[j].from) i=j; return i; }
function price(y){ return Math.pow(1.03, y-START); }           // cost inflation
function gdemand(y){ return Math.exp(0.049*(y-START)); }         // world trade growth
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerpTable(t, y){ // t: [[year,val],...]
  if(y<=t[0][0]) return t[0][1];
  for(let i=1;i<t.length;i++){ if(y<=t[i][0]){ const [y0,v0]=t[i-1],[y1,v1]=t[i]; return v0+(v1-v0)*(y-y0)/(y1-y0);} }
  return t[t.length-1][1];
}
const REQ_DEPTH = [[1950,8],[1965,9.5],[1980,12],[1995,14],[2008,15.5],[2020,17],[2050,18.5]];
function reqDepth(s){ return lerpTable(REQ_DEPTH, s.year) + s.shipBump; }
function wallNeeded(y){ return y<2032?0 : y<2040?1 : y<2046?2 : 3; }
function C(s,base){ return base*price(s.year); }

function newState(){
  return {
    v:1, year:START, treasury:14, teu:30, pop:40, approval:62, rep:40,
    depth:8, berths:2, terms:0, megas:0, auto:0, rail:0, airport:0, wh:0, ftz:0,
    housingCap:58, houses:0, edu:0, corr:25, green:0, wall:0,
    fee:2, tax:25, labor:1, agree:0, alliance:'none', court:0, shipBump:0, cruise:0, ecustoms:0, natline:0,
    projects:[], mods:[], hist:[{y:START,teu:30,t:14}], news:[],
    actionsLeft:ACTIONS, used:{}, nextEvent:START+2, lastEv:{}, debtYears:0,
    rev:0, exp:0, net:0, portRev:0, taxRev:0, demand:30, cap:50, prevTeu:30,
    flags:{}, over:null, pendingEvent:null
  };
}

/* ---- modifiers ---- */
function addMod(s,k,v,yrs,label){ s.mods.push({k,v,until:s.year+yrs,label}); }
function modMult(s,k){ let m=1; for(const x of s.mods) if(x.k===k) m*=x.v; return m; }
function modAdd(s,k){ let m=0; for(const x of s.mods) if(x.k===k) m+=x.v; return m; }
function news(s,txt){ s.news.unshift({y:s.year,t:txt}); if(s.news.length>40) s.news.length=40; }
function adjRep(s,d){ s.rep=clamp(s.rep+d,0,100); }
function adjAppr(s,d){ s.approval=clamp(s.approval+d,0,100); }

/* ---- derived economics ---- */
function capacity(s){
  const bbF = s.year<1972?1 : s.year<1990?0.6 : 0.35;
  let c = 15 + s.berths*25*bbF + (s.terms*320 + s.megas*2400)*(1+0.3*s.auto);
  return c * modMult(s,'cap') * floodFactor(s);
}
function floodFactor(s){ const miss = Math.max(0, wallNeeded(s.year)-s.wall); return 1 - 0.12*miss; }
function efficiency(s){ return [0.9,1,1.06][s.labor] * (1+0.02*s.edu); }
function depthFactor(s){
  const r = reqDepth(s);
  return s.depth>=r ? Math.min(1.1, 1+0.035*(s.depth-r)) : Math.max(0.2, 1-0.15*(r-s.depth));
}
function attract(s){
  const repF = 0.5 + s.rep/100;
  const taxF = 1.16 - 0.65*s.tax/100;
  const labF = [0.9,1,1.08][s.labor];
  const corrF = 1 - s.corr/260;
  const ally = s.alliance==='joined'?0.12 : 0;
  const greenF = s.year>=2012 ? s.green*0.05 - (s.year>=2025 && s.green===0 ? 0.08 : 0) : 0;
  const conn = 1 + 0.12*s.rail + 0.05*s.wh + 0.12*s.ftz + 0.07*s.agree + ally + 0.05*s.airport + greenF + 0.06*s.ecustoms + 0.03*s.edu + 0.1*(s.natline||0);
  return repF * FEE_ATTR[s.fee] * depthFactor(s) * taxF * labF * corrF * conn * modMult(s,'demand');
}
function demand(s){ return 30 * gdemand(s.year) * attract(s); }

function upkeep(s){
  const p = Math.pow(price(s.year), 0.6); // running costs inflate slower than construction
  const infra = s.berths*0.12 + s.terms*1.4 + s.megas*8 + s.auto*3 + s.rail*0.9 + s.airport*2.2 + s.wh*0.3 +
    s.ftz*0.5 + s.edu*0.7 + s.wall*1.8 + s.green*0.8 + s.depth*0.05 + s.cruise*0.8 + s.houses*0.25 + (s.natline||0)*3;
  const city = s.pop*0.014;
  return infra*p + city;
}

/* ---- yearly simulation ---- */
function simYear(s){
  const y = s.year;
  const log = [];
  s.prevTeu = s.teu;
  const D = demand(s);
  const cap = capacity(s) * efficiency(s);
  const target = Math.min(D, cap);
  s.teu = Math.max(5, s.teu + (target - s.teu) * (target > s.teu ? 0.6 : 0.8));
  s.demand = D; s.cap = cap;
  const cong = D / cap;

  // money
  const portRev = s.teu * FEE_RATE[s.fee] * modMult(s,'rev');
  const business = (s.pop*0.09 + s.teu*0.08) * (1 + 0.08*s.wh + 0.12*s.airport + 0.05*s.edu + 0.1*s.ftz + 0.1*s.cruise);
  const taxRev = business * s.tax/100 * (1 - 0.08*s.ftz);
  const up = upkeep(s);
  const interest = s.treasury < 0 ? s.treasury*0.09 : Math.min(s.treasury*0.02, 5*price(y));
  s.portRev = portRev; s.taxRev = taxRev;
  s.rev = portRev + taxRev + Math.max(0,interest);
  s.exp = up + Math.max(0,-interest);
  s.net = s.rev - s.exp;
  s.treasury += s.net;

  // population & housing
  const popT = 25 + 7*Math.sqrt(s.teu) * (1 + 0.06*s.edu + 0.12*s.airport + 0.1*s.cruise) + modAdd(s,'pop');
  let g = (popT - s.pop) * 0.07;
  if (s.pop > s.housingCap*1.2 && g > 0) g *= 0.3;
  s.pop = Math.max(10, s.pop + g);
  s.housingCap *= 1.024;
  const crowd = s.pop / s.housingCap;
  const overPen = crowd > 1 ? Math.min(30, (crowd-1)*90) : 0;

  // inequality
  const ineq = 25 + 8*s.ftz + [-8,0,10][s.labor] + (25 - s.tax)*0.5 - 3*s.edu - 1.5*Math.min(6,s.houses) + 4*s.auto;
  const ineqPen = Math.max(0, ineq-30) * 0.7;

  // approval
  const growth = (s.teu / Math.max(1,s.prevTeu) - 1) * 100;
  const growthB = clamp(growth*0.4, -8, 6);
  const appT = 61 + 1.5*s.edu + 2*s.green - overPen - ineqPen - 0.2*s.corr + growthB + (s.treasury<0?-7:0)
    - Math.max(0, wallNeeded(y)-s.wall)*6;
  s.approval = clamp(s.approval + (appT - s.approval)*0.3 + modAdd(s,'appr'), 0, 100);
  s.ineq = ineq; s.crowd = crowd;

  // reputation with shipping lines
  const r = reqDepth(s);
  const depthT = s.depth >= r ? 8 : -6*(r - s.depth);
  const congPen = cong > 1 ? Math.min(25, (cong-1)*40) : 0;
  const repT = 40 + (2-s.fee)*7 + depthT - congPen + s.court*3 + s.green*4 + s.agree*1.5 - s.corr*0.15
    + [-8,0,4][s.labor] + (s.alliance==='neutral'?3:0) + s.ecustoms*5 + (s.natline||0)*5;
  s.rep = clamp(s.rep + (repT - s.rep)*0.2 + modAdd(s,'rep'), 0, 100);
  s.cong = cong;

  // corruption drift
  s.corr = clamp(s.corr + 0.5 + 0.4*s.ftz + (s.labor===2?0.4:0) - 0.1*s.edu, 5, 100);

  // warnings
  if (cong > 1.15) log.push('Ships queue offshore — the port is congested. Build capacity!');
  if (s.depth < r - 0.5) log.push('Modern ships are too big for our shallow harbor. Dredge!');
  if (crowd > 1.08) log.push('Overcrowded tenements anger residents. Build housing.');
  if (wallNeeded(y) > s.wall) log.push('Seawater floods the docks at high tide. Build sea walls.');

  // game over checks
  const limit = -Math.max(20*price(y), s.rev*0.75);
  if (s.treasury < limit) s.debtYears++; else s.debtYears = 0;
  if (s.approval <= 0) s.over = 'overthrown';
  else if (s.debtYears >= 3) s.over = 'bankrupt';

  s.hist.push({y, teu:s.teu, t:s.treasury});
  return {log, cong};
}

function advanceYear(s){
  const res = simYear(s);
  if (s.over) return res;
  if (s.year >= END) { s.over = 'complete'; return res; }
  s.year++;
  // complete projects
  const done = [];
  s.projects = s.projects.filter(p => {
    if (p.done <= s.year) { const c = CARD_BY_ID[p.id]; c.finish(s); done.push(c.name); return false; }
    return true;
  });
  for (const n of done) news(s, n + ' completed.');
  s.mods = s.mods.filter(m => m.until > s.year);
  s.actionsLeft = ACTIONS; s.used = {};
  // era change
  if (eraIdx(s.year) !== eraIdx(s.year-1)) news(s, 'A new age dawns: ' + ERAS[eraIdx(s.year)].n + '.');
  // events
  if (s.year >= s.nextEvent) {
    const ev = pickEvent(s);
    if (ev) { s.pendingEvent = ev.id; s.lastEv[ev.id] = s.year; }
    s.nextEvent = s.year + 1 + Math.floor(Math.random()*3); // 1–3 years
  }
  res.done = done;
  return res;
}

function score(s){
  const p = price(s.year);
  const parts = {
    trade: Math.round(s.teu / 8),
    pop: Math.round(s.pop / 3),
    treasury: Math.round(s.treasury > 0 ? 120*Math.log(1 + s.treasury/p/40) : Math.max(-300, s.treasury/p/2)),
    approval: Math.round(s.approval * 8)
  };
  parts.total = parts.trade + parts.pop + parts.treasury + parts.approval;
  return parts;
}
const RANKS = [
  {min:-1e9, n:'Fishing Village', d:'Gulls outnumber cargo ships. The harbor sleeps.'},
  {min:900, n:'Coastal Town', d:'A tidy port serving local trade.'},
  {min:1700, n:'Regional Port', d:'Feeder ships and freighters keep the quays busy.'},

const CARD_BY_ID = {}; for (const c of CARDS) CARD_BY_ID[c.id] = c;

function cardCost(s,c){ return c.cost(s); }
function cardDesc(s,c){ return typeof c.desc==='function' ? c.desc(s) : c.desc; }
function cardStatus(s,c){ // returns null if available, else reason
  if (s.year < c.from) return 'Available from ' + c.from;
  if (c.to && s.year > c.to) return 'Obsolete';
  if (s.used[c.id]) return 'Done this year';
  if (c.req) { const r = c.req(s); if (r) return r; }
  if (c.max) { const inProg = s.projects.filter(p=>p.id===c.id).length; if (c.cur(s)+inProg >= c.max(s)) return 'Maximum built'; }
  if (c.delay && s.projects.some(p=>p.id===c.id)) return 'Already under construction';
  if (cardCost(s,c) > s.treasury + 0.001) return 'Not enough money';
  if (s.actionsLeft <= 0) return 'No actions left this year';
  return null;
}
function cardVisible(s,c){ return s.year >= c.from - 6 && !(c.to && s.year > c.to); }
function doCard(s,c){
  const st = cardStatus(s,c); if (st) return st;
  const cost = cardCost(s,c);
  s.treasury -= cost; s.actionsLeft--; s.used[c.id] = true;
  if (c.delay) { s.projects.push({id:c.id, done:s.year + c.delay, start:s.year}); news(s, 'Work begins: ' + c.name + ' (ready ' + (s.year+c.delay) + ').'); }
  else { c.instant(s); news(s, c.name + '.'); }
  return null;
}

function pickEvent(s){
  const pool = EVENTS.filter(e => s.year>=e.from && s.year<=e.to && (!e.need || e.need(s)) &&
    !(e.once && s.lastEv[e.id]) && !(s.lastEv[e.id] && s.year - s.lastEv[e.id] < 8));
  if (!pool.length) return null;
  let tot = pool.reduce((a,e)=>a+e.w,0), r = Math.random()*tot;
  for (const e of pool){ r -= e.w; if (r <= 0) return e; }
  return pool[pool.length-1];
}
function evText(s,v){ return typeof v==='function' ? v(s) : v; }
function choiceCost(s,ch){ if(!ch.cost) return 0; const b = typeof ch.cost==='function' ? ch.cost(s) : ch.cost; return C(s,b); }
function choiceStatus(s,ch){
  if (ch.need){ const r = ch.need(s); if (r) return r; }
  if (choiceCost(s,ch) > s.treasury + 0.001) return 'Not enough money';
  return null;
}
function resolveEvent(s, idx){
  const ev = EVENT_BY_ID[s.pendingEvent]; if (!ev) { s.pendingEvent=null; return; }
  const ch = ev.ch[idx];
  s.treasury -= choiceCost(s,ch);
  ch.f(s);
  s.corr = clamp(s.corr,5,100);
  news(s, evText(s,ev.head).replace(/:.*/,'') + ' — ' + ch.t.toLowerCase() + '.');
  s.pendingEvent = null;
}

const SAVE_KEY = 'portcity_save_v1', BEST_KEY = 'portcity_best_v1', SEEN_KEY='portcity_seen_help';
let S = null, undoStack = [], curTab = 'build', prevStats = null;
const $ = id => document.getElementById(id);

function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function wipe(k){ try{ localStorage.removeItem(k); }catch(e){} }
function save(){ if (S) store(SAVE_KEY, JSON.stringify(S)); }

function fmtMoney(v){
  const a = Math.abs(v), sg = v<0?'−':'';
  if (a >= 1000) return sg+'$'+(a/1000).toFixed(a>=10000?0:1)+'B';
  if (a >= 100) return sg+'$'+a.toFixed(0)+'M';
  return sg+'$'+a.toFixed(1)+'M';
}
function fmtTEU(k){ if (k >= 1000) return (k/1000).toFixed(k>=10000?1:2)+'M'; return Math.round(k)+'k'; }
function fmtPop(k){ if (k >= 1000) return (k/1000).toFixed(2)+'M'; return Math.round(k)+'k'; }

let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

function showScreen(name){
  const game = name==='game';
  $('title').classList.toggle('hidden', game);
  ['topbar','main','bottombar'].forEach(id=>$(id).classList.toggle('hidden', !game));
}

function titleScreen(){
  closeModal();
  showScreen('title');
  const sv = load(SAVE_KEY); let ok=false;
  if (sv) { try{ const o=JSON.parse(sv); ok = o && o.v===1 && !o.over; if(ok) $('btnContinue').textContent='Continue ('+o.year+')'; }catch(e){} }
  $('btnContinue').classList.toggle('hidden', !ok);
  const best = load(BEST_KEY);
  $('bestLine').textContent = best ? 'Best score: ' + best : '';
}

function startGame(fresh){
  if (fresh) { S = newState(); const t = JSON.parse(JSON.stringify(S)); simYear(t); for (const k of ['rev','exp','net','demand','cap','crowd','cong','portRev','taxRev']) S[k]=t[k]; news(S,'You take office as harbor governor. The quays are wooden, the cranes are men.'); }
  else { try{ S = JSON.parse(load(SAVE_KEY)); }catch(e){ S=null; } if(!S || S.v!==1){ S=newState(); } }
  undoStack = []; prevStats = null;
  showScreen('game');
  resizeCanvases(); render(); save();
  if (S.pendingEvent) showEvent();
  if (fresh && !load(SEEN_KEY)) showHelp();
}

function renderStats(){
  const st = [
    {ic:'💰', l:'Treasury', v:fmtMoney(S.treasury), raw:S.treasury, d: S.net, df:v=>(v>=0?'+':'')+fmtMoney(v).replace('$','$')},
    {ic:'📦', l:'TEU/yr', v:fmtTEU(S.teu), raw:S.teu},
    {ic:'👥', l:'Pop.', v:fmtPop(S.pop), raw:S.pop},
    {ic:'👍', l:'Approval', v:Math.round(S.approval)+'%', raw:S.approval},
    {ic:'⚓', l:'Rep.', v:Math.round(S.rep), raw:S.rep}
  ];
  $('stats').innerHTML = st.map((x,i)=>{
    let d = '';
    if (i===0) d = '<div class="d '+(S.net>=0?'up':'down')+'">'+(S.net>=0?'+':'')+fmtMoney(S.net)+'</div>';
    else if (prevStats) { const diff = x.raw - prevStats[i]; if (Math.abs(diff) > (i<3? x.raw*0.005 : 0.5)) d = '<div class="d '+(diff>0?'up':'down')+'">'+(diff>0?'▲':'▼')+'</div>'; else d='<div class="d">&nbsp;</div>'; }
    else d='<div class="d">&nbsp;</div>';
    return '<div class="stat"><div class="ic">'+x.ic+'</div><div class="v'+(i===0&&S.treasury<0?' down':'')+(i===3&&S.approval<25?' down':'')+'">'+x.v+'</div>'+d+'<div class="l">'+x.l+'</div></div>';
  }).join('');
  $('year').textContent = S.year;
  $('era').textContent = ERAS[eraIdx(S.year)].n;
  $('yprog').style.width = ((S.year-START)/(END-START)*100)+'%';
}

function renderInfo(){
  const r = reqDepth(S), cap = capacity(S)*efficiency(S);
  $('tagDepth').innerHTML = '🌊 Depth ' + S.depth.toFixed(0) + ' m <span style="color:'+(S.depth>=r?'#4ad991':'#ff8a8a')+'">/ ships need ' + r.toFixed(1) + ' m</span>';
  $('tagCap').textContent = '🏗 Capacity ' + fmtTEU(cap);
  const kv = [
    ['Revenue', fmtMoney(S.rev)], ['Expenses', fmtMoney(S.exp)],
    ['Port fees', FEE_NAMES[S.fee]], ['Corp. tax', S.tax+'%'],
    ['Labor rules', LABOR[S.labor]], ['Alliance', ({none:'Unaligned',joined:'Member',neutral:'Neutral'})[S.alliance]],
    ['Ship demand', fmtTEU(S.demand)], ['Housing', Math.round((S.crowd||S.pop/S.housingCap)*100)+'% full'],
  ];
  $('kv').innerHTML = kv.map(x=>'<div><span>'+x[0]+'</span><span>'+x[1]+'</span></div>').join('');
  const chips = [];
  for (const p of S.projects){ const c = CARD_BY_ID[p.id]; chips.push('<span class="chip">🚧 '+c.name+' · '+(p.done-S.year)+'y</span>'); }
  const seen = {};
  for (const m of S.mods){ if (seen[m.label]) continue; seen[m.label]=1; const good = (m.k==='appr'||m.k==='rep') ? m.v>0 : m.v>1; chips.push('<span class="chip '+(good?'':'warn')+'">'+(good?'📈 ':'⚠️ ')+m.label+' · '+(m.until-S.year)+'y</span>'); }
  if (S.cong > 1.1) chips.push('<span class="chip bad">🚢 Congested ×'+S.cong.toFixed(2)+'</span>');
  if (S.depth < r - 0.5) chips.push('<span class="chip bad">🌊 Harbor too shallow</span>');
  if ((S.crowd||0) > 1.05) chips.push('<span class="chip bad">🏚 Overcrowded</span>');
  if (wallNeeded(S.year) > S.wall) chips.push('<span class="chip bad">🌊 Flooding — need sea wall '+wallNeeded(S.year)+'</span>');
  if (S.debtYears>0) chips.push('<span class="chip bad">💀 Deep debt '+S.debtYears+'/3 yrs</span>');
  if (S.corr > 45) chips.push('<span class="chip warn">🕵️ Corruption '+Math.round(S.corr)+'</span>');
  $('chips').innerHTML = chips.join('');
  $('news').innerHTML = S.news.slice(0,12).map(n=>'<div><b>'+n.y+'</b>'+n.t+'</div>').join('') || '<div>No news yet.</div>';
}

function renderCards(){
  const list = CARDS.filter(c => c.cat===curTab && cardVisible(S,c));

    const st = cardStatus(S,c), cost = cardCost(S,c);
    const meta = [];
    if (c.delay) meta.push('⏳ '+c.delay+' yr'+(c.delay>1?'s':'')); else meta.push('⚡ Instant');
    if (c.max) meta.push('Lv '+c.cur(S)+'/'+c.max(S));
    if (c.lvl) meta.push('Now: '+c.lvl(S));
    const done = st==='Done this year';
    return '<button class="card'+(st?(done?' done':' dis'):'')+'" data-c="'+c.cat+'" data-id="'+c.id+'">'+
      '<div class="ci">'+c.icon+'</div><div class="cb"><div class="cn"><span>'+c.name+'</span><span class="cost">'+(cost>0?fmtMoney(cost):'Free')+'</span></div>'+
      '<div class="cd">'+cardDesc(S,c)+'</div><div class="cm">'+meta.map(m=>'<span>'+m+'</span>').join('')+

function renderBottom(){
  let p=''; for(let i=0;i<ACTIONS;i++) p+='<i class="'+(i>=S.actionsLeft?'used':'')+'"></i>';

/* ---- actions ---- */
function onCard(id){
  const c = CARD_BY_ID[id]; if (!c) return;
  const st = cardStatus(S,c);
  if (st) { toast(st); return; }
  undoStack.push(JSON.stringify(S));
  doCard(S,c);
  toast((c.delay ? '🚧 ' : '✅ ') + c.name + (c.delay ? ' — ready in '+(S.year+c.delay) : ''));
  save(); render();
}
function onUndo(){ if(!undoStack.length) return; S = JSON.parse(undoStack.pop()); save(); render(); toast('Undone'); }

function onEndYear(){
  if (S.pendingEvent) { showEvent(); return; }
  prevStats = [S.treasury,S.teu,S.pop,S.approval,S.rep];
  const before = {teu:S.teu, treasury:S.treasury, year:S.year};
  const res = advanceYear(S);
  undoStack = [];
  for (const l of res.log) if (Math.random()<0.6) news(S, l);
  save();
  if (S.over) { render(); gameOver(); return; }
  render();
  const dt = S.teu - before.teu;
  toast(before.year+': '+(S.net>=0?'+':'')+fmtMoney(S.net)+' · TEU '+(dt>=0?'▲':'▼')+' '+fmtTEU(Math.abs(dt)) + (res.done && res.done.length ? ' · ✅ '+res.done.join(', ') : ''));
  if (S.pendingEvent) setTimeout(showEvent, 350);
}

function showEvent(){
  const ev = EVENT_BY_ID[S.pendingEvent]; if (!ev) { S.pendingEvent=null; return; }

    ev.ch.map((ch,i)=>{ const st = choiceStatus(S,ch), cost = choiceCost(S,ch);
      return '<button class="choice" data-i="'+i+'" '+(st?'disabled':'')+'><b>'+ch.t+(cost>0?' <span style="color:var(--warn)">('+fmtMoney(cost)+')</span>':'')+'</b><small>'+evText(S,ch.h)+(st?' — <span style="color:var(--bad)">'+st+'</span>':'')+'</small></button>'; }).join('');

function gameOver(){
  const sc = score(S), rk = rankFor(sc.total);
  const best = +(load(BEST_KEY)||0);
  if (S.over==='complete' && sc.total > best) store(BEST_KEY, String(sc.total));
  let head, sub;
  if (S.over==='overthrown'){ head='🔥 Overthrown!'; sub='Angry crowds storm the harbor office in '+S.year+'. Your term is over.'; }
  else if (S.over==='bankrupt'){ head='💀 Bankrupt!'; sub='Creditors seize the port in '+S.year+' after three years of crushing debt.'; }
  else { head='🏁 The Year 2050'; sub='A century of governance comes to an end.'; }
  const peak = S.hist.reduce((a,h)=>Math.max(a,h.teu),0);
  openModal(
    '<h1>'+head+'</h1><p>'+sub+'</p>'+
    (S.over==='complete' ? '<div class="small">Your port is remembered as a</div><div class="rank">'+rk.n+'</div><p>'+rk.d+'</p>' : '<div class="small">Had history ended here, your port would be a</div><div class="rank">'+rk.n+'</div>')+
    '<div class="report">'+
    '<span>Trade volume ('+fmtTEU(S.teu)+' TEU)</span><span>'+sc.trade+'</span>'+
    '<span>Population ('+fmtPop(S.pop)+')</span><span>'+sc.pop+'</span>'+
    '<span>Treasury ('+fmtMoney(S.treasury)+')</span><span>'+sc.treasury+'</span>'+
    '<span>Approval ('+Math.round(S.approval)+'%)</span><span>'+sc.approval+'</span>'+
    '<span style="border-top:1px solid var(--line);padding-top:4px"><b>Total score</b></span><span style="border-top:1px solid var(--line);padding-top:4px;color:var(--warn)">'+sc.total+'</span>'+
    '</div>'+
    '<p class="small">Peak trade: '+fmtTEU(peak)+' TEU · Ranks: Fishing Village < Coastal Town (900) < Regional Port (1700) < Major Hub (2800) < Global Gateway (3800)</p>'+
    '<button class="btn" style="width:100%;margin-top:8px" id="goNew">Play Again</button>'+
    '<button class="btn sec" style="width:100%;margin-top:8px" id="goTitle">Title Screen</button>', false);
  $('goNew').onclick = ()=>{ closeModal(); startGame(true); };
  $('goTitle').onclick = ()=>{ wipe(SAVE_KEY); titleScreen(); };
}

/* ---- chart ---- */
function drawChart(){
  const cv = $('chart'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio||1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W*dpr) { cv.width = W*dpr; cv.height = H*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const h = S.hist, max = Math.max(50, ...h.map(p=>p.teu));
  $('chartMax').textContent = 'peak ' + fmtTEU(max);
  const pl=4, pr=4, pt=6, pb=14;
  const x = y => pl + (y-START)/(END-START)*(W-pl-pr);
  const yv = v => pt + (1 - v/max)*(H-pt-pb);
  // era bands
  ERAS.forEach((e,i)=>{ const x0=x(e.from), x1=i<ERAS.length-1?x(ERAS[i+1].from):x(END);
    ctx.fillStyle = i%2? 'rgba(255,255,255,0.035)':'rgba(255,255,255,0)'; ctx.fillRect(x0,pt,x1-x0,H-pt-pb); });
  ctx.fillStyle='#6f87a6'; ctx.font='9px system-ui'; ctx.textAlign='center';
  [1950,1975,2000,2025,2050].forEach(yr=>ctx.fillText(yr, clamp(x(yr),12,W-12), H-3));
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.beginPath(); ctx.moveTo(pl,yv(0)); ctx.lineTo(W-pr,yv(0)); ctx.stroke();
  if (h.length < 2) return;
  const g = ctx.createLinearGradient(0,pt,0,H-pb); g.addColorStop(0,'rgba(63,182,255,.45)'); g.addColorStop(1,'rgba(63,182,255,0)');
  ctx.beginPath(); ctx.moveTo(x(h[0].y), yv(0));
  h.forEach(p=>ctx.lineTo(x(p.y), yv(p.teu))); ctx.lineTo(x(h[h.length-1].y), yv(0)); ctx.closePath();
  ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); h.forEach((p,i)=> i?ctx.lineTo(x(p.y),yv(p.teu)):ctx.moveTo(x(p.y),yv(p.teu)));
  ctx.strokeStyle='#3fb6ff'; ctx.lineWidth=2; ctx.stroke();
  const L = h[h.length-1]; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x(L.y),yv(L.teu),3,0,7); ctx.fill();
}

/* ---- harbor scene ---- */
let sceneShips = [], lastFrame = 0, trainX = 0;
function rng(seed){ let x = seed>>>0 || 1; return ()=>{ x ^= x<<13; x>>>=0; x ^= x>>17; x ^= x<<5; x>>>=0; return x/4294967296; }; }
function resizeCanvases(){
  const cv = $('scene'), dpr = window.devicePixelRatio||1;
  cv.width = cv.clientWidth*dpr; cv.height = cv.clientHeight*dpr;
  const ch = $('chart'); ch.width = ch.clientWidth*dpr; ch.height = ch.clientHeight*dpr;
  if (S) drawChart();
}
function shipCountTarget(){ return clamp(1 + Math.floor(Math.log2(Math.max(1,S.teu/15))), 1, 10); }
function newShip(W,H,qy,i){
  const lane = Math.random();
  return {x: Math.random()*W, y: 20 + Math.random()*(qy-60), vx:(Math.random()<.5?-1:1)*(6+Math.random()*10), phase: Math.random()<0.5?'sail':'dock', t: Math.random()*10, seed: Math.random()*1e9|0, dockX: 0, lane};
}
function drawScene(ts){
  requestAnimationFrame(drawScene);
  if (!S || $('main').classList.contains('hidden')) return;
  if (ts - lastFrame < 33) return;
  const dt = Math.min(0.1, (ts - lastFrame)/1000); lastFrame = ts;
  const cv = $('scene'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio||1;
  const W = cv.width/dpr, H = cv.height/dpr; if (!W) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const era = eraIdx(S.year);
  const flood = Math.max(0, wallNeeded(S.year)-S.wall);
  const qy = Math.round(H*0.56) + flood*4; // quay line
  // water: deeper = darker
  const dn = clamp((S.depth-8)/14,0,1);
  const wg = ctx.createLinearGradient(0,0,0,qy);
  const c1 = `rgb(${Math.round(70-50*dn)},${Math.round(170-100*dn)},${Math.round(200-90*dn)})`;
  const c2 = `rgb(${Math.round(110-60*dn)},${Math.round(200-90*dn)},${Math.round(215-70*dn)})`;
  wg.addColorStop(0,c1); wg.addColorStop(1,c2);
  ctx.fillStyle = wg; ctx.fillRect(0,0,W,qy+2);
  // waves
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1;
  for (let i=0;i<14;i++){ const yy = (i*37 % (qy-10)) + 6, xx = ((i*97 + ts/60) % (W+40)) - 20; ctx.beginPath(); ctx.moveTo(xx,yy); ctx.quadraticCurveTo(xx+5,yy-2,xx+10,yy); ctx.stroke(); }
  // dredged channel
  const chW = 10 + (S.depth-8)*3;
  ctx.fillStyle='rgba(5,25,60,'+(0.15+dn*0.25)+')';
  ctx.beginPath(); ctx.moveTo(W*0.62-chW/2,0); ctx.lineTo(W*0.62+chW/2,0); ctx.lineTo(W*0.5+chW,qy); ctx.lineTo(W*0.5-chW,qy); ctx.fill();
  // breakwater
  ctx.strokeStyle='#8c8f94'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-5,qy*0.35); ctx.quadraticCurveTo(W*0.25,qy*0.18,W*0.38,qy*0.28); ctx.stroke();
  // lighthouse
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(W*0.38,qy*0.28,4,0,7); ctx.fill();
  ctx.fillStyle='#e33'; ctx.beginPath(); ctx.arc(W*0.38,qy*0.28,2,0,7); ctx.fill();
  if (Math.floor(ts/800)%2){ ctx.fillStyle='rgba(255,240,150,.35)'; ctx.beginPath(); ctx.arc(W*0.38,qy*0.28,10,0,7); ctx.fill(); }
  // wind turbines on breakwater (green)
  for (let i=0;i<S.green*2;i++){ const tx = 14 + i*22, ty = qy*0.33 - i*3.2;
    ctx.fillStyle='#ddd'; ctx.beginPath(); ctx.arc(tx,ty,2,0,7); ctx.fill();
    ctx.strokeStyle='#f4f4f4'; ctx.lineWidth=1.5; const a = ts/400 + i;
    for (let k=0;k<3;k++){ const aa=a+k*2.094; ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx+Math.cos(aa)*8,ty+Math.sin(aa)*8); ctx.stroke(); } }

  // land
  const landC = era>=1 && S.terms ? '#7d8790' : '#b9ad86';
  ctx.fillStyle = landC; ctx.fillRect(0,qy,W,H-qy);
  // city area (lower land)
  const cityY = qy + 34;
  ctx.fillStyle = era>=2 ? '#5d6a63' : '#8a9a6a'; ctx.fillRect(0,cityY,W,H-cityY);
  // roads
  ctx.fillStyle='#454b52'; ctx.fillRect(0,cityY-2,W,3);
  for (let i=1;i<5;i++) ctx.fillRect(i*W/5,cityY,2,H-cityY);
  // quay edge / sea wall
  ctx.fillStyle = S.wall ? '#c9ccd1' : '#6b5a3e'; ctx.fillRect(0,qy-1,W,S.wall?2+S.wall*1.5:3);
  // FTZ fence
  if (S.ftz){ ctx.setLineDash([3,3]); ctx.strokeStyle='#ffd34d'; ctx.lineWidth=1.2; ctx.strokeRect(W*0.62,qy+3,W*0.36,28); ctx.setLineDash([]);
    ctx.fillStyle='#ffd34d'; ctx.font='bold 8px system-ui'; ctx.textAlign='left'; ctx.fillText('FTZ'+(S.ftz>1?' ×'+S.ftz:''),W*0.62+3,qy+30); }
  // warehouses
  for (let i=0;i<S.wh;i++){ const wx = W*0.64 + (i%3)*(W*0.11), wy = qy+6+Math.floor(i/3)*11;
    ctx.fillStyle='#d6d0c4'; ctx.fillRect(wx,wy,W*0.1,8); ctx.fillStyle='#a69e8e'; ctx.fillRect(wx,wy+6,W*0.1,2); }
  // terminals: container yards with stacks
  const r = rng(77);
  const facilities = [];
  for (let i=0;i<Math.min(S.berths,6);i++) facilities.push('b');
  for (let i=0;i<S.terms;i++) facilities.push('t');
  for (let i=0;i<S.megas;i++) facilities.push('m');
  const slots = facilities.slice(-12);
  const yardW = W*0.6;
  let fx = 4;
  const per = yardW / Math.max(4, slots.length);
  const cranes = [];
  slots.forEach((f,i)=>{
    const x0 = fx + i*per;
    if (f==='b'){ ctx.fillStyle='#8b6b43'; ctx.fillRect(x0+per*0.2, qy-10, per*0.6, 11); cranes.push({x:x0+per*0.5,s:0.6,t:'b'}); }
    else { const big = f==='m';
      ctx.fillStyle = big ? '#5b6670' : '#6e7882'; ctx.fillRect(x0+1, qy+2, per-2, big?28:22);
      for (let k=0;k<(big?10:6);k++){ ctx.fillStyle = ['#d64541','#2e86de','#f39c12','#27ae60','#8e44ad','#e67e22'][Math.floor(r()*6)];
        ctx.fillRect(x0+3+(k%5)*(per-6)/5, qy+5+Math.floor(k/5)*7, (per-6)/5-1.5, 5); }
      cranes.push({x:x0+per*0.3,s:big?1.3:1,t:'g'}); if (big||S.auto) cranes.push({x:x0+per*0.75,s:big?1.3:1,t:'g'}); }
  });
  // cranes
  for (const c of cranes){
    if (c.t==='b'){ ctx.strokeStyle='#5a4630'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(c.x,qy-2); ctx.lineTo(c.x+6,qy-14); ctx.stroke(); continue; }
    const h = 16*c.s; ctx.fillStyle = S.auto? '#2fb5a6':'#e2a03f';
    ctx.fillRect(c.x-1.5, qy-h, 3, h+6);
    ctx.fillRect(c.x-3, qy-h-1, 6, 3);
    ctx.fillRect(c.x-1, qy-h-14*c.s, 2, 14*c.s); // boom over water
    ctx.fillStyle='rgba(0,0,0,.2)'; ctx.fillRect(c.x+2, qy-h+2, 3, h);
  }
  // rail link
  if (S.rail){ const ry = qy+31; ctx.strokeStyle='#3d3d3d'; ctx.lineWidth=2;
    for (let k=0;k<S.rail && k<2;k++){ ctx.beginPath(); ctx.moveTo(0,ry+k*4); ctx.lineTo(W,ry+k*4); ctx.stroke(); }
    trainX = (trainX + dt*40*S.rail) % (W+120);
    const tx = W - trainX;
    for (let k=0;k<6;k++){ ctx.fillStyle = k===0?'#c0392b':['#2e86de','#f39c12','#27ae60'][k%3]; ctx.fillRect(tx+k*11, ry-2, 10, 5); } }
  // city buildings
  const cr = rng(1234);
  const nB = clamp(Math.round(S.pop/12), 5, 60);
  const cols = 12, bw = W/cols;
  for (let i=0;i<nB;i++){
    const col = i % cols, row = Math.floor(i/cols);
    const bx = col*bw + 3 + cr()*4, by = cityY + 6 + row*((H-cityY-8)/5) + cr()*3;
    const tall = clamp(S.pop/400 + cr()*1.5, 0.3, 4);
    const sz = bw*0.55;
    if (by+sz > H-2) continue;
    if (S.airport && bx > W*0.66 && by > H-26) continue;
    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(bx+tall*2, by+tall*1.5, sz, sz); // shadow = height
    const shade = era>=2 && tall>1.5 ? ['#b8d4ea','#9cb8cf','#d0dde8'] : ['#d9c6a5','#c7a982','#e5d7bd','#b98d6a'];
    ctx.fillStyle = shade[Math.floor(cr()*shade.length)]; ctx.fillRect(bx,by,sz,sz);
    if (tall>2){ ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(bx+1,by+1,sz-2,2); }
  }
  // housing blocks (public housing)
  for (let i=0;i<Math.min(S.houses,8);i++){ const hx = 4 + i*14, hy = H-12; ctx.fillStyle='#e8a87c'; ctx.fillRect(hx,hy,11,9); ctx.fillStyle='#a0522d'; ctx.fillRect(hx,hy,11,2); }
  // airport runway
  if (S.airport){ ctx.fillStyle='#3a3f45'; ctx.fillRect(W*0.68,H-20,W*0.3,10*S.airport>10?14:9);
    ctx.fillStyle='#fff'; for(let k=0;k<6;k++) ctx.fillRect(W*0.7+k*W*0.045,H-16,W*0.025,1.2);
    const px = W*0.68 + ((ts/30) % (W*0.32)); ctx.fillStyle='#fff'; ctx.font='10px system-ui'; ctx.fillText('✈', px, H-12); }
  // flooding overlay
  if (flood){ ctx.fillStyle='rgba(60,140,200,'+(0.15+0.1*flood)+')'; ctx.fillRect(0,qy,W,10+flood*8); }

  // ships
  const target = shipCountTarget();
  while (sceneShips.length < target) sceneShips.push(newShip(W,H,qy,sceneShips.length));
  if (sceneShips.length > target) sceneShips.length = target;
  const shipLen = [18,24,30,36,40][era] , shipH = [6,7,8,9,10][era];
  sceneShips.forEach((sh,i)=>{
    sh.t += dt;
    if (sh.phase==='sail'){ sh.x += sh.vx*dt; if (sh.x < -50) sh.x = W+40; if (sh.x > W+50) sh.x = -40;
      if (sh.t > 12) { sh.phase='dock'; sh.t=0; } }
    else { if (sh.t > 9) { sh.phase='sail'; sh.t=0; } }
    let x = sh.x, y = sh.y;
    if (sh.phase==='dock' && slots.length){ const idx = i % slots.length; x = 4 + idx*per + per*0.15; y = qy - shipH - 6; }
    else if (sh.phase==='dock') { x = W*0.45; y = qy - shipH - 6; }
    const L = shipLen * (i%3===0?1:0.8);
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(x+2,y+2,L,shipH);
    ctx.fillStyle = era===0 ? '#3b3b3b' : '#1f2d3d';
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+L-4,y); ctx.lineTo(x+L,y+shipH/2); ctx.lineTo(x+L-4,y+shipH); ctx.lineTo(x,y+shipH); ctx.closePath(); ctx.fill();
    if (era>=1){ const sr = rng(sh.seed); const n = Math.floor((L-8)/4);
      for (let k=0;k<n;k++){ ctx.fillStyle=['#d64541','#2e86de','#f39c12','#27ae60','#ecf0f1'][Math.floor(sr()*5)]; ctx.fillRect(x+3+k*4, y+1.5, 3.2, shipH-3); } }
    else { ctx.fillStyle='#7a5c3a'; ctx.fillRect(x+4,y+2,L-12,shipH-4); }
    ctx.fillStyle='#f4f4f4'; ctx.fillRect(x+1,y+1,3,shipH-2); // bridge
    if (sh.phase==='sail'){ ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=1; ctx.beginPath(); const back = sh.vx>0? x : x+L; ctx.moveTo(back,y+shipH/2); ctx.lineTo(back - Math.sign(sh.vx)*10, y+shipH/2-3); ctx.moveTo(back,y+shipH/2); ctx.lineTo(back - Math.sign(sh.vx)*10, y+shipH/2+3); ctx.stroke(); }
  });
  // label
  ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='bold 10px system-ui'; ctx.textAlign='right';
  ctx.fillText(slots.length? (S.terms+S.megas? (S.terms+S.megas)+' terminals':'') : '', W-8, qy-6);
}

/* ---- wiring ---- */
$('btnNew').onclick = ()=>{
  const sv = load(SAVE_KEY);
  if (sv && !$('btnContinue').classList.contains('hidden')) {
    openModal('<h1>New game?</h1><p>This will overwrite your saved game.</p><button class="btn" style="width:100%;margin-top:8px" id="cfYes">Start over</button><button class="btn sec" style="width:100%;margin-top:8px" id="cfNo">Cancel</button>', true);
    $('cfYes').onclick = ()=>{ closeModal(); startGame(true); }; $('cfNo').onclick = closeModal;
  } else startGame(true);
};
$('btnContinue').onclick = ()=>startGame(false);
$('btnHow').onclick = showHelp;
$('btnHelp').onclick = showHelp;
$('btnQuit').onclick = ()=>{ save(); titleScreen(); };
$('btnEnd').onclick = onEndYear;
$('btnUndo').onclick = onUndo;
$('tabs').onclick = e => { const b = e.target.closest('.tab'); if(!b) return; curTab = b.dataset.c;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t===b)); renderCards(); };
$('cards').onclick = e => { const b = e.target.closest('.card'); if (b) onCard(b.dataset.id); };
window.addEventListener('resize', ()=>{ resizeCanvases(); });
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) save(); });
titleScreen();
requestAnimationFrame(drawScene);
</script>
